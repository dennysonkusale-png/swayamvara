<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>स्ववृत्त · Swavritta — this app has moved</title>
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="6; url=https://dennysonkusale-png.github.io/swavritta/" />
<style>
  :root{--maroon:#7a1f2b;--gold:#c99a3c;--ink:#3a2410;--muted:#8a6b45}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:radial-gradient(1200px 600px at 50% -10%,#fdf3e3,#f7ead4);
       color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .card{max-width:560px;width:100%;background:#fffdf8;border:1px solid #eadfc9;border-radius:22px;
        padding:40px 30px 34px;box-shadow:0 18px 50px rgba(60,30,10,.13)}
  .mark{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 14px;border-radius:13px;
        background:linear-gradient(145deg,var(--maroon),#a83244);color:#f6d98a;
        font-family:"Noto Serif Devanagari",serif;font-size:16px;font-weight:700;letter-spacing:.4px}
  h1{margin:20px 0 8px;font-size:26px;letter-spacing:.3px;color:var(--maroon)}
  p{margin:0 0 14px;color:#5a4632}
  .hint{color:var(--muted);font-size:14px}
  .btn{display:inline-block;margin:10px 0 6px;padding:14px 26px;border-radius:12px;
       background:linear-gradient(145deg,var(--maroon),#a83244);color:#fff8ec;text-decoration:none;
       font-weight:600;box-shadow:0 10px 26px rgba(122,31,43,.28)}
  .btn:hover{filter:brightness(1.06)}
  .url{font-size:13px;color:var(--muted);word-break:break-all;margin:16px 0 0}
  .url a{color:var(--maroon)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,#e0c9a6,transparent);margin:24px 0 18px}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">स्ववृत्त</div>
    <h1>This app has moved</h1>
    <p>The marriage portfolio (biodata) builder <strong>स्ववृत्त · Swavritta</strong> now lives at a new address.</p>
    <p class="hint">Taking you there in a moment — or tap the button below.</p>
    <a class="btn" href="https://dennysonkusale-png.github.io/swavritta/">Go to Swavritta &rarr;</a>
    <div class="rule"></div>
    <p class="url"><a href="https://dennysonkusale-png.github.io/swavritta/">https://dennysonkusale-png.github.io/swavritta/</a></p>
  </main>
</body>
</html>
